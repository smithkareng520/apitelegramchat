# =====================================================================
# render.yaml — Render 平台部署配置
# =====================================================================
# 使用方法:
#   1. 把本文件放到项目根目录
#   2. 在 Render 控制台选择 "New → Blueprint" → 选这个文件
#   3. 所有环境变量在 Render 的 Environment 页面配置为 Secret
#      (而不是 Plain Text)
# =====================================================================

services:
  - type: web
    name: telegram-bot
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: TZ
        value: Asia/Shanghai
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: XXTF_API_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_REGION
        value: auto
      - key: WEBHOOK_URL
        sync: false
      # ⚠️ 必须为 false（代码默认值即 false，此处显式固化并修正历史误配）：
      # 设 true 时每次重启/部署/健康检查失败重启都会调用
      # setWebhook?drop_pending_updates=true，把 Telegram 侧积压的 update
      # 永久丢弃——停机窗口内的消息不投递、不回复、日志里也永远不出现，
      # 正是"消息凭空消失、没有任何新日志"假象的元凶之一。
      # false 时由健康实例自动重放排干积压（bot 会迟到回复，但不丢消息）。
      - key: DROP_PENDING_ON_STARTUP
        value: "false"
      - key: SERPER_API_KEY
        sync: false
      - key: GAODE_MCP_URL
        sync: false
      - key: GAODE_MCP_TOKEN
        sync: false
      - key: SANDBOX_MAX_PROCS
        value: "50"
      - key: SANDBOX_MAX_CPU_SEC
        value: "300"
      - key: SANDBOX_MAX_FILE_SIZE
        value: "104857600"
      - key: SANDBOX_MAX_OPEN_FILES
        value: "256"
      - key: SANDBOX_TIMEOUT_SEC
        value: "120"
      - key: SUBAGENT_MAX_ROUNDS
        value: "32"
      - key: SUBAGENT_DEFAULT_TIMEOUT
        value: "900"
      - key: SUBAGENT_LLM_TIMEOUT
        value: "180"
      - key: SUBAGENT_TOOL_TIMEOUT
        value: "120"
      - key: SUBAGENT_OUTER_TIMEOUT
        value: "930"
      - key: MAX_CONCURRENT_TOOLS
        value: "16"
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1
