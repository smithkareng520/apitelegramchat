# =====================================================================
# render.yaml — Render 平台部署配置
# =====================================================================
# 使用方法:
#   1. 把本文件放到项目根目录
#   2. 在 Render 控制台选择 "New → Blueprint" → 选这个文件
#   3. 所有环境变量在 Render 的 Environment 页面配置为 Secret
#      (而不是 Plain Text)
# =====================================================================

services:
  - type: web
    name: telegram-bot
    runtime: docker
    plan: starter              # 至少 starter，free 实例易被杀
    region: singapore          # 或选离用户最近的
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    # 关键: 不开启特权模式（Render 默认就不开，这里只是声明）
    # Render 不支持 docker run 参数，但 Dockerfile 里的 USER + bwrap 已经够用
    envVars:
      # ----- 必需: 标记为 Secret -----
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # ----- R2 -----
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_REGION
        value: auto
      # ----- 第三方服务 -----
      - key: GEOAPIFY_KEY
        sync: false
      - key: IMGBB_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      # ----- DuckDuckGo 免费搜索 API（非敏感，Plain Text）-----
      # 默认指向 my-search-api onrender 实例；如自部署请改为自己服务的地址。
      # 调用方式：<DDG_SEARCH_API_URL>?text=<quoted query>
      - key: DDG_SEARCH_API_URL
        value: https://my-search-api-08cb.onrender.com/duckduckgo/search
      # ----- 沙箱配置（非敏感，Plain Text）-----
      - key: SANDBOX_UNSHARE_NET
        value: "1"             # 改成 "1" 可完全断网（最严格）
      - key: SANDBOX_MAX_PROCS
        value: "50"
      - key: SANDBOX_MAX_CPU_SEC
        value: "300"
      - key: SANDBOX_MAX_FILE_SIZE
        value: "104857600"     # 100 MB
      - key: SANDBOX_MAX_OPEN_FILES
        value: "256"
      - key: SANDBOX_TIMEOUT_SEC
        value: "120"
      - key: SUBAGENT_MAX_ROUNDS
        value: "16"
      - key: SUBAGENT_DEFAULT_TIMEOUT
        value: "180"
      - key: SUBAGENT_LLM_TIMEOUT
        value: "120"
      - key: SUBAGENT_TOOL_TIMEOUT
        value: "60"
      - key: LOG_LEVEL
        value: INFO
    # 资源限制（Render 层面）
    disk:                      # Render 不挂持久盘 — workspace 走 R2
      name: tmp
      mountPath: /tmp
      sizeGB: 1                # 临时盘，重启清空
