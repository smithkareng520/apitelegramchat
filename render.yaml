# =====================================================================
# render.yaml — Render 平台部署配置
# =====================================================================
# 使用方法:
#   1. 把本文件放到项目根目录
#   2. 在 Render 控制台选择 "New → Blueprint" → 选这个文件
#   3. 所有环境变量在 Render 的 Environment 页面配置为 Secret
#      (而不是 Plain Text)
# =====================================================================

services:
  - type: web
    name: telegram-bot
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_REGION
        value: auto
      - key: GEOAPIFY_KEY
        sync: false
      - key: IMGBB_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: DDG_SEARCH_API_URL
        value: https://my-search-api-08cb.onrender.com/duckduckgo/search
      - key: SANDBOX_MAX_PROCS
        value: "50"
      - key: SANDBOX_MAX_CPU_SEC
        value: "300"
      - key: SANDBOX_MAX_FILE_SIZE
        value: "104857600"
      - key: SANDBOX_MAX_OPEN_FILES
        value: "256"
      - key: SANDBOX_TIMEOUT_SEC
        value: "120"
      - key: SUBAGENT_MAX_ROUNDS
        value: "16"
      - key: SUBAGENT_DEFAULT_TIMEOUT
        value: "180"
      - key: SUBAGENT_LLM_TIMEOUT
        value: "120"
      - key: SUBAGENT_TOOL_TIMEOUT
        value: "60"
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1
