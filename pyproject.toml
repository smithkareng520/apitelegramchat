[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apitelegramchat"
version = "2.1.0"
description = "Telegram AI assistant with MCP-native tool exposure"
requires-python = ">=3.10"
dependencies = [
  "aiohttp==3.11.15",
  "openai==1.66.3",
  "Pillow==11.1.0",
  "quart==0.20.0",
  "trafilatura==1.12.2",
  "lxml==5.3.0",
  "curl_cffi==0.7.1",
  "feedparser==6.0.11",
  "qrcode==7.4.2",
  "cachetools==5.5.0",
  "aioboto3==12.4.0",
  "numpy<2.0.0",
]

[project.scripts]
apitelegramchat-mcp = "apitelegramchat.entrypoints.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["apitelegramchat*"]
