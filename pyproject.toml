[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apitelegramchat"
version = "2.2.0"
description = "Telegram AI assistant with MCP-native tool exposure"
requires-python = ">=3.10"
dependencies = [
  "aiohttp==3.11.15",
  "mcp>=1.28,<2",
  "openai==1.66.3",
  "anthropic==0.69.0",
  "Pillow==11.1.0",
  "quart==0.20.0",
  "trafilatura==1.12.2",
  "lxml==5.3.0",
  "curl_cffi==0.7.1",
  "feedparser==6.0.11",
  "qrcode==7.4.2",
  "cachetools==5.5.0",
  "aioboto3==12.4.0",
  "numpy<2.0.0",
  "defusedxml==0.7.1",
  "pypdf==5.9.0",
  "pdfplumber==0.11.6",
  "reportlab==4.3.1",
  "pypdfium2==4.30.1",
  "pdf2image==1.17.0",
  "pytesseract==0.3.13",
  "pandas==2.2.3",
  "tiktoken==0.11.0",
  "json-repair>=0.30,<1",
  "jsonschema>=4.23,<5",
]

[project.scripts]
apitelegramchat-mcp = "entrypoints.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "ai_handlers",
  "api_client",
  "app",
  "chat_actions",
  "config",
  "context_manager",
  "context_window",
  "fetch_rich_content",
  "fetch_url_fallback",
  "file_handlers",
  "markdown_converter",
  "mcp_client",
  "memory_tool",
  "message_user_tool",
  "net_shims",
  "proactive",
  "s3_utils",
  "sandbox",
  "search_engine",
  "serper_api",
  "skills",
  "state",
  "subagent_tool",
  "telegram_polling",
  "todo_tool",
  "token_budget",
  "tool_assembly",
  "tool_context_compaction",
  "tool_executors",
  "tool_result_condense",
  "tool_visibility",
  "turn_recovery",
  "utils",
  "verify_security",
  "version",
  "web_search_filter",
  "web_search_settings",
  "webhook_sync",
  "workspace_paths",
  "workspace_utils",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai*", "entrypoints*", "mcpserver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

# =============================================================================
# mypy 静态类型检查（运行：python3 -m mypy；CI 建议与 pytest 同跑）
# -----------------------------------------------------------------------------
# 定位：本项目是高度动态的 Telegram bot / LLM 编排代码（Telegram update、
# 工具 JSON schema、多家 LLM SDK 载荷都是运行时决定形状），因此默认档不
# 追求全仓 strict，而是三层策略：
#   1) 全量函数签名注解 —— disallow_untyped_defs / disallow_incomplete_defs
#      全局开启（仓库内 src/ 已 100% 注解，新增未注解 def 会直接报错）；
#   2) 对函数体内的真实类型错误保持检查 —— check_untyped_defs；
#   3) 无类型 stub 的第三方库一律 ignore_missing_imports，避免运行环境
#      差异带来的噪音（需要更强校验时可按库安装 types-* 后移出该设置）。
# 逐模块收紧路径：把模块加入下方 overrides 的 strict 档（extra_checks）
# 即可对该模块启用更严格规则；新模块默认继承全局档。
# =============================================================================
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# 动态边界模块的定向放宽（理由：与外部 SDK/运行时形状深度交互）。
# 收紧方式：删除对应条目并修复报错。
[[tool.mypy.overrides]]
# Anthropic SDK 流式事件是 13 个成员的联合类型，桥接层按 event.type 在
# 运行时分发属性访问（event.content_block / block.id 等）；mypy 无法沿
# 该分发模式收窄联合（报 union-attr）。对这两个模块定向关闭 union-attr，
# 其余全部检查保持开启。收紧路径：把 event 按 isinstance/type 分支重构
# 后删除本条目。
module = ["ai.anthropic_bridge", "ai_handlers"]
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = [
  "app",                    # Quart 路由装饰器改变签名，handler 返回值动态
  "mcpserver.*",            # MCP SDK @list_tools 等装饰器签名由 SDK 决定
  "entrypoints.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
ignore_errors = true
