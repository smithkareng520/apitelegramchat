[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apitelegramchat"
version = "2.2.0"
description = "Telegram AI assistant with MCP-native tool exposure"
requires-python = ">=3.10"
dependencies = [
  "aiohttp==3.11.15",
  "mcp>=1.28,<2",
  "openai==1.66.3",
  "anthropic==0.69.0",
  "Pillow==11.1.0",
  "quart==0.20.0",
  "trafilatura==1.12.2",
  "lxml==5.3.0",
  "curl_cffi==0.7.1",
  "feedparser==6.0.11",
  "qrcode==7.4.2",
  "cachetools==5.5.0",
  "aioboto3==12.4.0",
  "numpy<2.0.0",
  "defusedxml==0.7.1",
  "pypdf==5.9.0",
  "pdfplumber==0.11.6",
  "reportlab==4.3.1",
  "pypdfium2==4.30.1",
  "pdf2image==1.17.0",
  "pytesseract==0.3.13",
  "pandas==2.2.3",
  "tiktoken==0.11.0",
  "json-repair>=0.30,<1",
  "jsonschema>=4.23,<5",
]

[project.scripts]
apitelegramchat-mcp = "entrypoints.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "ai_handlers",
  "api_client",
  "app",
  "chat_actions",
  "config",
  "context_manager",
  "context_window",
  "fetch_rich_content",
  "fetch_url_fallback",
  "file_handlers",
  "markdown_converter",
  "mcp_client",
  "memory_tool",
  "message_user_tool",
  "net_shims",
  "proactive",
  "s3_utils",
  "sandbox",
  "search_engine",
  "serper_api",
  "skills",
  "state",
  "subagent_tool",
  "telegram_polling",
  "todo_tool",
  "token_budget",
  "tool_assembly",
  "tool_context_compaction",
  "tool_executors",
  "tool_result_condense",
  "tool_visibility",
  "turn_recovery",
  "utils",
  "verify_security",
  "version",
  "web_search_filter",
  "web_search_settings",
  "webhook_sync",
  "workspace_paths",
  "workspace_utils",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai*", "entrypoints*", "mcpserver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
